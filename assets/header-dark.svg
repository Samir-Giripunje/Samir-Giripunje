<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title">
  <title id="title">Samir Giripunje: AI engineer building agentic systems and on-device AI apps</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#a78bfa"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <clipPath id="frame"><rect width="1200" height="360" rx="16"/></clipPath>
  </defs>
  <style>
    .label { font: 600 13px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; letter-spacing: 2px; fill: url(#accent); }
    .name  { font: 700 56px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #e6edf3; letter-spacing: -1px; }
    .sub   { font: 400 21px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #9198a1; }
    .chip  { font: 500 14px -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; fill: #e6edf3; }
    .term  { font: 400 16px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; }
    .fade  { opacity: 0; animation: in .6s ease-out forwards; }
    .line  { opacity: 0; animation: in .35s ease-out forwards; }
    .cursor { opacity: 0; animation: blink 1.1s step-end infinite; }
    .orb   { animation: drift 9s ease-in-out infinite alternate; }
    @keyframes in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    @keyframes drift { from { transform: translate(0, 0); } to { transform: translate(-60px, 30px); } }
    @media (prefers-reduced-motion: reduce) {
      .fade, .line { animation: none; opacity: 1; }
      .cursor, .orb { animation: none; opacity: 1; }
    }
  </style>

  <g clip-path="url(#frame)">
  <rect width="1200" height="360" fill="url(#bg)"/>
  <rect width="1200" height="360" fill="url(#grid)"/>
  <circle class="orb" cx="900" cy="80" r="320" fill="url(#glow)"/>
  <rect x="0" y="0" width="1200" height="3" fill="url(#accent)"/>

  <g class="fade">
    <text x="64" y="104" class="label">AI ENGINEER · NEEDL.AI</text>
    <text x="62" y="170" class="name">Samir Giripunje</text>
  </g>
  <g class="fade" style="animation-delay:.25s">
    <text x="64" y="214" class="sub">I build AI agents and LLM pipelines,</text>
    <text x="64" y="244" class="sub">and free, fully local AI apps for the Mac.</text>
  </g>
  <g class="fade" style="animation-delay:0.5s"><rect x="64" y="270" width="112" height="34" rx="17" fill="#161b22" stroke="#30363d"/><text x="120.0" y="292" text-anchor="middle" class="chip">Agentic AI</text></g>
  <g class="fade" style="animation-delay:0.62s"><rect x="186" y="270" width="120" height="34" rx="17" fill="#161b22" stroke="#30363d"/><text x="246.0" y="292" text-anchor="middle" class="chip">LLM systems</text></g>
  <g class="fade" style="animation-delay:0.74s"><rect x="316" y="270" width="128" height="34" rx="17" fill="#161b22" stroke="#30363d"/><text x="380.0" y="292" text-anchor="middle" class="chip">On-device ML</text></g>

  <g class="fade" style="animation-delay:.6s">
    <rect x="648" y="52" width="488" height="256" rx="12" fill="#0a0e14" stroke="#30363d"/>
    <circle cx="672" cy="74" r="6" fill="#ff5f57"/><circle cx="692" cy="74" r="6" fill="#febc2e"/><circle cx="712" cy="74" r="6" fill="#28c840"/>
    <text x="892" y="79" text-anchor="middle" style="font: 400 13px ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, monospace; fill: #7d8590;">agent — zsh</text>
    <line x1="648" y1="96" x2="1136" y2="96" stroke="#21262d"/>
    <text x="684" y="126" class="term"><tspan fill="#a78bfa">$</tspan><tspan fill="#e6edf3"> agent run "morning market brief"</tspan></text>
  </g>
  <g class="term">
  <g class="line" style="animation-delay:1.10s"><text x="684" y="152" fill="#7d8590">›</text><text x="706" y="152" fill="#79c0ff">plan</text><text x="818" y="152" fill="#c9d1d9">3 steps</text></g>
  <g class="line" style="animation-delay:1.65s"><text x="684" y="182" fill="#7d8590">›</text><text x="706" y="182" fill="#79c0ff">tool</text><text x="818" y="182" fill="#c9d1d9">search_news(range="24h")</text></g>
  <g class="line" style="animation-delay:2.20s"><text x="684" y="212" fill="#7d8590">›</text><text x="706" y="212" fill="#79c0ff">llm</text><text x="818" y="212" fill="#c9d1d9">claude → gemini fallback</text></g>
  <g class="line" style="animation-delay:2.75s"><text x="684" y="242" fill="#7d8590">›</text><text x="706" y="242" fill="#79c0ff">classify</text><text x="818" y="242" fill="#c9d1d9">high 8 · medium 23</text></g>
  <g class="line" style="animation-delay:3.30s"><text x="684" y="272" fill="#3fb950">✓</text><text x="706" y="272" fill="#79c0ff">done</text><text x="818" y="272" fill="#3fb950">brief.md · 41s</text></g>
  <rect class="cursor" x="684" y="286" width="9" height="19" fill="#c9d1d9" style="animation-delay:3.85s"/>
  </g>
  </g>
</svg>
